[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dot"
description = "Dotfiles management CLI"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "argcomplete>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "mypy",
    "ruff",
    "pytest>=8.0",
    "types-PyYAML",
    "pytest-cov>=5.0",
    "coverage>=7.0",
]

[project.scripts]
dot = "dot.cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["dot*"]

[tool.setuptools.dynamic]
version = { attr = "dot.__version__" }

[tool.ruff]
# Matches requires-python; controls which pyupgrade (UP) rewrites apply.
target-version = "py311"
# Lets import sorting (I) treat the `dot` package as first-party.
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
# ruff format owns line length.
ignore = ["E501"]
