# Per-device mouse pointer acceleration.
#
# This is the declarative equivalent of:
#
#     xinput --set-prop <id> 'libinput Accel Speed' -1.0
#
# Because each section matches on the device product name, it only ever applies
# to the physical mice listed below. Virtual pointers used by remote desktop
# tools (for example RustDesk's XTEST pointer) are not matched by InputClass, so
# remote sessions are unaffected by design rather than by a runtime check.
#
# This file is installed to /etc/X11/xorg.conf.d/ by `dot provision system`.
#
# Caveats:
#   - X11/Xorg only; it has no effect under Wayland (sway), where `xinput`
#     cannot address real devices either.
#   - Changes take effect on the next X server start, or on device re-plug.
#
# To add a device, run `xinput list` and use the exact product string. The
# imperative version of this logic lives in bin/set_mouse_sensitivty.sh.

Section "InputClass"
    Identifier "Mouse acceleration: Logitech G Pro"
    MatchDriver "libinput"
    MatchIsPointer "on"
    MatchProduct "Logitech G Pro"
    # -1.0 is maximum deceleration; the valid range is -1.0 to 1.0.
    Option "AccelSpeed" "-1.0"
EndSection

Section "InputClass"
    Identifier "Mouse acceleration: SINOWEALTH 2.4G Wireless Receiver"
    MatchDriver "libinput"
    MatchIsPointer "on"
    MatchProduct "SINOWEALTH 2.4G Wireless Receiver"
    # -1.0 is maximum deceleration; the valid range is -1.0 to 1.0.
    Option "AccelSpeed" "-1.0"
EndSection
